<header class="topbar">
  <a class="brand" routerLink="/coupon">
    <img class="logo" src="maks-logo-small.png" alt="MAKS - Finest Craftsmanship" />
    <span class="brand-text">Maksdoors <span class="brand-word">Coupons</span></span>
  </a>

  <div class="right">
    <app-contact-badge [raised]="onCouponPage()" />
    <a class="nav-link" routerLink="/claimed" routerLinkActive="active">Claimed coupons</a>
    <a class="nav-link" href="/payment-details" [class.active]="onPaymentPage()"
       (click)="$event.preventDefault(); openPasswordPrompt()">Payment Settings</a>

    <div class="profile">
      <button type="button" class="dp" (click)="menuOpen.set(!menuOpen())"
              aria-label="Account menu" [attr.aria-expanded]="menuOpen()">
        @if (user()?.photoUrl) {
          <img [src]="user()!.photoUrl" alt="Your photo" />
        } @else {
          <span>{{ initial() }}</span>
        }
      </button>
      @if (menuOpen()) {
        <div class="menu" role="menu">
          <div class="menu-name">{{ user()?.name }}</div>
          <div class="menu-phone">{{ user()?.phone }}</div>
          <button type="button" class="menu-item" role="menuitem" (click)="signOut()">Sign out</button>
        </div>
      }
    </div>
  </div>
</header>

@if (pwOpen()) {
  <div class="modal-backdrop">
    <form class="modal" role="dialog" aria-modal="true" aria-labelledby="pw-title"
          (click)="$event.stopPropagation()" (ngSubmit)="submitPassword()" (keydown.escape)="closePasswordPrompt()">
      <h2 id="pw-title">Enter your password</h2>
      <p>For your security, please confirm your password to open Payment Settings.</p>
      <div class="pw-wrap">
        <input name="pw" [type]="showPw() ? 'text' : 'password'" [(ngModel)]="pwValue"
               autocomplete="current-password" placeholder="Your password" autofocus />
        <button type="button" class="pw-toggle" (click)="showPw.set(!showPw())">{{ showPw() ? 'Hide' : 'Show' }}</button>
      </div>
      @if (pwError()) { <div class="pw-error" role="alert">{{ pwError() }}</div> }
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closePasswordPrompt()">Cancel</button>
        <button type="submit" class="btn-ok" [disabled]="pwBusy()">{{ pwBusy() ? 'Checking…' : 'Continue' }}</button>
      </div>
    </form>
  </div>
}
